<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Jost';src:url('fonts/jost-variable.woff2') format('woff2');font-weight:100 900;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
.card{position:relative;width:1200px;height:630px;background:#050505;font-family:'Jost',system-ui,sans-serif;
  overflow:hidden;color:#EDEEF1}
/* dezenter Teal-Schimmer oben-links (CI „Stille") */
.glow{position:absolute;width:900px;height:900px;left:-160px;top:-360px;border-radius:50%;
  background:radial-gradient(circle,rgba(62,207,178,.16),rgba(62,207,178,.04) 40%,transparent 62%);filter:blur(6px)}
.glow2{position:absolute;width:620px;height:620px;right:-180px;bottom:-320px;border-radius:50%;
  background:radial-gradient(circle,rgba(62,207,178,.10),transparent 60%)}
.inner{position:absolute;inset:0;padding:86px 90px;display:flex;flex-direction:column;justify-content:center}
.brand{font-weight:500;font-size:98px;letter-spacing:.02em;line-height:1;color:#fff;
  text-shadow:0 0 34px rgba(62,207,178,.28)}
.claim{margin-top:26px;font-weight:300;font-size:44px;letter-spacing:.005em;color:#C9CBD1}
.claim em{font-style:normal;font-weight:500;color:#3ECFB2}
.sub{margin-top:14px;font-weight:300;font-size:23px;letter-spacing:.02em;color:#7d7f88}
.products{position:absolute;left:90px;bottom:64px;font-weight:400;font-size:21px;letter-spacing:.18em;
  text-transform:uppercase;color:#9aa0a6}
.products b{color:#3ECFB2;font-weight:500}
.dot{color:#3a3a40;padding:0 10px}
.host{position:absolute;right:90px;bottom:64px;font-weight:400;font-size:21px;letter-spacing:.1em;color:#5a5c64}
/* Puls-Linie (Heart-Motiv) — dezent unten */
.pulse{position:absolute;left:0;right:0;bottom:116px;width:1200px;height:96px;opacity:.42}
</style></head>
<body><div class="card">
  <div class="glow"></div><div class="glow2"></div>
  <svg class="pulse" viewBox="0 0 1200 120" fill="none" preserveAspectRatio="none">
    <path d="M0 60 H360 l22 -40 l26 78 l24 -96 l22 108 l20 -50 H620 l18 -22 l16 44 l16 -30 H1200"
      stroke="#3ECFB2" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>
  </svg>
  <div class="inner">
    <div class="brand">Vitalkultur</div>
    <div class="claim">Science. <em>Made tangible.</em></div>
    <div class="sub">honest with every number.</div>
  </div>
  <div class="products">CARLON<span class="dot">·</span><b>CARLON&nbsp;Equine</b><span class="dot">·</span>CARLON&nbsp;Research</div>
  <div class="host">vitalkultur.com</div>
</div></body></html>
