<title>OG-Bild bauen — CARLON Equine Messstation</title>
<!-- Werkzeug, kein Ziel: gehoert nicht in den Index. Die Seite wird mit dem
     Repo ausgeliefert, unverlinkt ist nicht dasselbe wie unerreichbar. -->
<meta name="robots" content="noindex">
<!-- ═══════════════════════════════════════════════════════════════════════
     WERKZEUG, kein Produkt. Zeichnet das Vorschaubild, das beim Teilen der
     Messstation erscheint (WhatsApp, Instagram, LinkedIn, Signal).

     Warum als Seite und nicht von Hand in einem Grafikprogramm:
     die Wolke ist ECHT. Sie stammt aus einer realen Aufnahme (Testpferd 2,
     Polar H10, 24.06.2026, 325 Schläge, Ø 34 bpm) und wird mit derselben
     Konstruktion gezeichnet wie die Teilkarte in der Messstation. Ein
     nachgemalter Punktehaufen wäre eine Behauptung; das hier ist ein Bild
     von einem Herzen.

     Erzeugen:
       node cdp.mjs "http://127.0.0.1:8765/carlon-equine/app/og-bauen.html" t-og.js > /tmp/og.txt
     und die Datenadresse aus /tmp/og.txt in eine Datei schreiben.
     Aufruf über ./og-bauen.sh in scripts/carlon-closed-loop.
     ═══════════════════════════════════════════════════════════════════════ -->
<style>
@font-face{font-family:'Jost';font-style:normal;font-weight:300 700;font-display:block;src:url('assets/fonts/jost-variable.woff2') format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:400 700;font-display:block;src:url('assets/fonts/inter-variable.woff2') format('woff2')}
html,body{margin:0;background:#111;color:#ddd;font-family:Inter,system-ui,sans-serif}
canvas{display:block;margin:20px auto;max-width:96vw;box-shadow:0 10px 60px rgba(0,0,0,.6)}
p{text-align:center;font-size:13px;color:#888}
</style>
<canvas id="c" width="2400" height="1260"></canvas>
<p>1200 × 630 · Vorschaubild der Messstation · Wolke aus einer echten Aufnahme</p>
<script>
/* Die Aufnahme. Bewusst eingebettet und nicht nachgeladen: dieses Werkzeug
   soll in fünf Jahren noch dasselbe Bild erzeugen, auch wenn die
   Labordateien längst woanders liegen. Quelle:
   carlon-h10-lab/sessions/CARLON_Testpferd2_HRV-Session_2026-06-24T18-46-12Z_9m_n325 */
const RR_QUELLE = 'Testpferd 2 · Polar H10 · 24.06.2026 · 325 Schläge · Ø 34 bpm';
let RR = [];

async function laden(){
  const r = await fetch('og-rr.json');
  RR = await r.json();
}

/* ── Die Zeichnung ──────────────────────────────────────────────────────
   Querformat, deshalb NICHT die quadratische Teilkarte beschnitten,
   sondern neu gesetzt: Wolke links, Wort rechts. Ein zugeschnittenes
   Quadrat verliert genau das, was die Karte trägt — die Ruhe um die Wolke. */
function zeichne(sprache){
  /* Fassung 2 (24.11.2026, Sitzung Website): QUADRAT-SICHER.
     WhatsApp (kleine Vorschau), Signal und manche Mail-Programme schneiden das
     Bild auf ein Quadrat aus der Mitte (x 285 bis 915). Fassung 1 hatte Wolke
     links und Text rechts: im Quadrat blieb von beidem je eine Haelfte.
     Jetzt traegt die Mitte allein die ganze Botschaft (Marke, Wolke, Satz,
     Adresse). Die Seitenfluegel ergaenzen nur, was im Breitformat Platz hat.
     Kein Gedankenstrich im Bildtext (Jans Regel). */
  const c=document.getElementById('c'), x=c.getContext('2d');
  const W=1200,H=630,K=2, SQ0=(W-H)/2, SQ1=SQ0+H;
  c.width=W*K; c.height=H*K;
  x.setTransform(K,0,0,K,0,0);
  const CY='#3ECFB2', TXT='#EDEEF1', DIM='#A3A4AD';
  const brand='Jost, system-ui, sans-serif', ui='Inter, system-ui, sans-serif';
  x.fillStyle='#0A0A0C'; x.fillRect(0,0,W,H);

  const MX=W/2, MY=212;
  const gl=x.createRadialGradient(MX,MY,0,MX,MY,520);
  gl.addColorStop(0,'rgba(62,207,178,0.16)'); gl.addColorStop(1,'rgba(62,207,178,0)');
  x.fillStyle=gl; x.fillRect(0,0,W,H);

  /* Blume des Lebens, gerechnet: 3r nach jeder Seite muessen ins Bild */
  x.save(); x.globalAlpha=.13; x.strokeStyle=CY; x.lineWidth=1;
  (function(){ const r=Math.floor(Math.min(MY, H-MY)/3) - 8;
    const pts=[[MX,MY]];
    for(let i=0;i<6;i++){const a=Math.PI/3*i; pts.push([MX+r*Math.cos(a),MY+r*Math.sin(a)]);}
    for(let i=0;i<6;i++){const a=Math.PI/3*i; pts.push([MX+2*r*Math.cos(a),MY+2*r*Math.sin(a)]);}
    for(let i=0;i<6;i++){const a=Math.PI/3*i+Math.PI/6,d=r*Math.sqrt(3);
      pts.push([MX+d*Math.cos(a),MY+d*Math.sin(a)]);}
    pts.forEach(([px,py])=>{ x.beginPath(); x.arc(px,py,r,0,Math.PI*2); x.stroke(); });
  })(); x.restore();

  /* Die Wolke (echte Aufnahme), Ausschnitt 1. bis 99. Perzentil wie Fassung 1 */
  const paare=[]; for(let i=1;i<RR.length;i++) paare.push([RR[i-1],RR[i]]);
  const alle=paare.flat().slice().sort((a,b)=>a-b);
  const lo=alle[Math.floor(alle.length*0.01)], hi=alle[Math.floor(alle.length*0.99)];
  const spanne=Math.max(1,hi-lo), pad=spanne*0.14;
  const S0=232, ox=MX-S0/2, oy=MY-S0/2;
  const abb=(v)=>((v-(lo-pad))/(spanne+2*pad));
  let draussen=0;
  paare.forEach(([a,b])=>{
    const px=ox+abb(a)*S0, py=oy+S0-abb(b)*S0;
    if(px<ox-6||px>ox+S0+6||py<oy-6||py>oy+S0+6){ draussen++; return; }
    x.beginPath(); x.arc(px,py,3.3,0,Math.PI*2);
    x.fillStyle='rgba(62,207,178,0.92)'; x.fill();
  });

  const T = sprache==='en' ? {
    kopf1:"Your horse's heart,", kopf2:'measured in your own stable.',
    unter:'Polar H10 and a browser. No app, no account, free.',
    links:['Every dot is one heartbeat,','plotted against the one before.','Real recording · Polar H10'],
    rechts:['You send the recording','to your veterinary practice.','Android, or Chrome on a computer'],
  } : {
    kopf1:'Das Herz deines Pferdes,', kopf2:'im eigenen Stall gemessen.',
    unter:'Polar H10 und Browser. Ohne App, ohne Konto, kostenlos.',
    links:['Jeder Punkt ist ein Herzschlag,','gegen den Schlag davor.','Echte Aufnahme · Polar H10'],
    rechts:['Die Aufnahme schickst du','deiner Tierarztpraxis.','Android oder Chrome am Rechner'],
  };

  const gesetzt=[];
  /* Setzt eine Zeile in [x0,x1] (Ausrichtung a) und verkleinert, BIS sie passt.
     Grenze wird mitgeschrieben: der Erzeuger bricht ab, wenn etwas uebersteht. */
  function zeile(text, groesse, familie, gewicht, x0, x1, y, farbe, a, mindest){
    let g=groesse; const breit=x1-x0;
    do{ x.font=`${gewicht} ${g}px ${familie}`; if(x.measureText(text).width<=breit) break; g-=1; } while(g>(mindest||12));
    x.textAlign=a; x.fillStyle=farbe;
    x.fillText(text, a==='center'?(x0+x1)/2 : a==='right'?x1:x0, y);
    gesetzt.push({text, groesse:g, breite:Math.round(x.measureText(text).width), spalte:breit});
    return g;
  }
  const RAND=44; /* Innenrand des Quadrats */
  x.fillStyle=CY; x.font=`600 14px ${brand}`; x.letterSpacing='6px'; x.textAlign='center';
  x.fillText('CARLON EQUINE', MX+3, 56); x.letterSpacing='0px';
  const g1=zeile(T.kopf1, 42, brand, 500, SQ0+RAND, SQ1-RAND, 404, TXT, 'center', 30);
  zeile(T.kopf2, g1, brand, 500, SQ0+RAND, SQ1-RAND, 404+g1*1.18, TXT, 'center', 30);
  zeile(T.unter, 18, ui, 400, SQ0+RAND, SQ1-RAND, 404+g1*1.18+44, DIM, 'center', 14);
  x.strokeStyle='rgba(62,207,178,0.30)'; x.lineWidth=1;
  x.beginPath(); x.moveTo(MX-90,540); x.lineTo(MX+90,540); x.stroke();
  zeile('vitalkultur.com/messen', 23, ui, 600, SQ0+RAND, SQ1-RAND, 578, CY, 'center', 16);

  /* Seitenfluegel: nur im Breitformat sichtbar, darum nichts Unverzichtbares */
  const FL=34, FR=SQ0-18;
  T.links.forEach((t,i)=>zeile(t, i<2?14:13, ui, i<2?400:500, FL, FR, MY-14+i*24+(i==2?14:0), i<2?DIM:CY, 'left', 11));
  T.rechts.forEach((t,i)=>zeile(t, i<2?14:13, ui, i<2?400:500, SQ1+18, W-FL, MY-14+i*24+(i==2?14:0), i<2?DIM:CY, 'right', 11));

  const zuBreit=gesetzt.filter(z=>z.breite>z.spalte);
  return {draussen, paare:paare.length, lo:Math.round(lo), hi:Math.round(hi),
          spalte:SQ1-SQ0-2*RAND, zeilen:gesetzt, zuBreit:zuBreit.length};
}

window.__og = async function(sprache){
  if(!RR.length) await laden();
  try{ await document.fonts.load('500 54px Jost'); await document.fonts.load('400 22px Inter'); }catch(e){}
  try{ await document.fonts.ready; }catch(e){}
  const info = zeichne(sprache||'de');
  const c=document.getElementById('c');
  return { info, quelle:RR_QUELLE, bild:c.toDataURL('image/jpeg',0.92) };
};
(async()=>{ await laden(); zeichne('de'); })();
</script>
